<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preencher Anamnese - Sistema AEE</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="Santa Branca Logo.png" alt="Prefeitura de Santa Branca" class="logo-sidebar">
                <h2>Sistema AEE</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    Dashboard
                </a>
                <a href="estudantes.html" class="nav-item">
                    <span class="icon">👨‍🎓</span>
                    Estudantes
                </a>
                <a href="anamnese.html" class="nav-item" id="menuAnamnese">
                    <span class="icon">📋</span>
                    Gerenciar Anamnese
                </a>
                <a href="preencher.html" class="nav-item active">
                    <span class="icon">✏️</span>
                    Preencher Anamnese
                </a>
                <a href="#" class="nav-item" id="btnLogout">
                    <span class="icon">🚪</span>
                    Sair
                </a>
            </nav>
            <div class="sidebar-footer">
                <div id="userInfo" class="user-info">
                    <span class="user-name">Carregando...</span>
                    <span class="user-role"></span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h1>Preencher Anamnese</h1>
            </header>

            <div class="content">
                <div class="form-container" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label for="selectEstudante">Selecione o Estudante *</label>
                        <select id="selectEstudante" required>
                            <option value="">Selecione um estudante</option>
                        </select>
                    </div>
                </div>

                <div id="anamneseForm" class="form-container" style="display: none;">
                    <h3>Questionário de Anamnese</h3>
                    <div id="perguntasContainer"></div>
                    <div class="form-actions">
                        <button class="btn-secondary" onclick="clearForm()">Limpar</button>
                        <button class="btn-primary" onclick="salvarAnamnese()">Salvar Respostas</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/preencher.js"></script>
</body>
</html>
